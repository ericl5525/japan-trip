<!-- EXPENSE MODAL WITH CUSTOM SPLIT CHECKBOXES -->
<div id="modal-expense" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-3 sm:p-4">
    <div class="bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl shadow-xl max-w-md w-full p-5 space-y-3">
        <div class="flex justify-between items-center border-b dark:border-slate-700 pb-2.5">
            <h3 class="text-base font-bold" id="expense-modal-title">Add Expense Item</h3>
            <button onclick="closeModal('modal-expense')" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form id="expense-form" onsubmit="saveExpense(event)" class="space-y-2.5 text-xs sm:text-sm">
            <input type="hidden" id="exp-id">
            <div>
                <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">Item Description</label>
                <input type="text" id="exp-name" required placeholder="e.g. Shinagawa Airbnb, Train Ticket, Dinner" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg p-2">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">Amount ($ USD)</label>
                    <input type="number" step="0.01" id="exp-amount" required placeholder="0.00" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg p-2">
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">Who Paid?</label>
                    <select id="exp-payer" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg p-2"></select>
                </div>
            </div>

            <!-- Custom Split Options -->
            <div>
                <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">Split Between (Who Benefits?)</label>
                <div id="expense-split-checkboxes" class="flex flex-wrap gap-2 pt-1"></div>
            </div>

            <div>
                <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">Category</label>
                <select id="exp-category-select" onchange="toggleCustomCategory(this.value)" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg p-2">
                    <option value="Lodging">Lodging</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Food & Dining">Food & Dining</option>
                    <option value="Activities">Activities</option>
                    <option value="Misc">Misc</option>
                    <option value="Custom">+ Custom Category / Text Input</option>
                </select>
            </div>
            <div id="custom-category-container" class="hidden">
                <label class="block font-semibold text-slate-600 dark:text-slate-300 mb-1">Custom Category Name</label>
                <input type="text" id="exp-category-custom" placeholder="e.g. Souvenirs, Shinkansen, etc." class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg p-2">
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal('modal-expense')" class="px-3 py-1.5 font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-lg">Cancel</button>
                <button type="submit" class="px-3 py-1.5 font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg">Save Expense</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openExpenseModal() { 
        document.getElementById('expense-form').reset();
        toggleCustomCategory('Lodging');

        // Populate Split Checkboxes dynamically
        const boxContainer = document.getElementById('expense-split-checkboxes');
        if(boxContainer) {
            boxContainer.innerHTML = '';
            travelers.forEach(t => {
                boxContainer.innerHTML += `
                    <label class="inline-flex items-center space-x-1.5 bg-slate-100 dark:bg-slate-700 px-2.5 py-1.5 rounded-lg cursor-pointer text-xs font-medium">
                        <input type="checkbox" name="split-participants" value="${t}" checked class="rounded text-emerald-600 focus:ring-emerald-500">
                        <span>${t}</span>
                    </label>`;
            });
        }
        openModal('modal-expense'); 
    }

    function saveExpense(e) {
        e.preventDefault();
        const selectVal = document.getElementById('exp-category-select').value;
        const customVal = document.getElementById('exp-category-custom').value;
        const finalCategory = (selectVal === 'Custom' && customVal.trim()) ? customVal.trim() : selectVal;

        // Get checked split participants
        const checkboxes = document.querySelectorAll('input[name="split-participants"]:checked');
        let selectedSplit = Array.from(checkboxes).map(cb => cb.value);

        if(selectedSplit.length === 0) {
            selectedSplit = [...travelers]; // Default to all if none checked
        }

        db.ref('expenses').push({
            description: document.getElementById('exp-name').value,
            amount: parseFloat(document.getElementById('exp-amount').value),
            paidBy: document.getElementById('exp-payer').value,
            splitWith: selectedSplit,
            category: finalCategory
        });
        closeModal('modal-expense');
    }

    function renderExpenses() {
        const tbody = document.getElementById('expenses-table-body');
        const summaryContainer = document.getElementById('expenses-summary-cards');
        const settlementContainer = document.getElementById('settlement-container');

        if(!tbody || !summaryContainer || !settlementContainer) return;

        tbody.innerHTML = '';
        summaryContainer.innerHTML = '';
        settlementContainer.innerHTML = '';

        const N = travelers.length;
        if (N === 0) {
            settlementContainer.innerHTML = `<div class="text-slate-400">Please add group travelers to calculate settlements.</div>`;
            return;
        }

        let totalSpent = 0;
        let paidMap = {};
        let owedShareMap = {};

        travelers.forEach(t => {
            paidMap[t] = 0;
            owedShareMap[t] = 0;
        });

        // Compute itemized ledger and custom split shares
        expenses.forEach(exp => {
            const amt = parseFloat(exp.amount) || 0;
            totalSpent += amt;

            if (paidMap[exp.paidBy] !== undefined) {
                paidMap[exp.paidBy] += amt;
            }

            // Split logic: calculate per-item beneficiaries
            const splitList = (exp.splitWith && Array.isArray(exp.splitWith) && exp.splitWith.length > 0) ? exp.splitWith : travelers;
            const itemShare = amt / splitList.length;

            splitList.forEach(p => {
                if(owedShareMap[p] !== undefined) {
                    owedShareMap[p] += itemShare;
                }
            });

            const splitLabel = splitList.length === N ? 'All 3' : splitList.join(', ');

            tbody.innerHTML += `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50">
                    <td class="p-3 font-medium text-slate-800 dark:text-slate-200">
                        <div>${exp.description}</div>
                        <div class="text-[10px] text-slate-400">Split: ${splitLabel}</div>
                    </td>
                    <td class="p-3"><span class="text-[10px] sm:text-xs bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full font-medium text-slate-700 dark:text-slate-300">${exp.category}</span></td>
                    <td class="p-3 font-semibold text-slate-800 dark:text-slate-200">$${amt.toFixed(2)}</td>
                    <td class="p-3"><span class="font-semibold text-xs text-slate-700 dark:text-slate-300">${exp.paidBy}</span></td>
                    <td class="p-3 text-right">
                        <button onclick="deleteExpense('${exp.id}')" class="text-xs text-red-500 hover:underline">Remove</button>
                    </td>
                </tr>`;
        });

        // Summary Cards
        summaryContainer.innerHTML += `
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Total Spent</span>
                <div class="text-lg sm:text-2xl font-black text-slate-900 dark:text-white mt-0.5">$${totalSpent.toFixed(2)}</div>
            </div>`;

        travelers.forEach(t => {
            summaryContainer.innerHTML += `
                <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <span class="text-[10px] font-semibold text-blue-500 uppercase tracking-wider">${t} Paid</span>
                    <div class="text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 mt-0.5">$${(paidMap[t] || 0).toFixed(2)}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5">Fair share: $${(owedShareMap[t] || 0).toFixed(2)}</div>
                </div>`;
        });

        // Directional Debt Matching based on Net Balances
        let debtors = [];
        let creditors = [];

        travelers.forEach(t => {
            const netBalance = Math.round(((paidMap[t] || 0) - (owedShareMap[t] || 0)) * 100) / 100;
            if (netBalance < -0.01) debtors.push({ name: t, amount: Math.abs(netBalance) });
            else if (netBalance > 0.01) creditors.push({ name: t, amount: netBalance });
        });

        let i = 0, j = 0;
        let count = 0;

        while (i < debtors.length && j < creditors.length) {
            let d = debtors[i];
            let c = creditors[j];
            let amount = Math.min(d.amount, c.amount);
            amount = Math.round(amount * 100) / 100;

            if (amount > 0) {
                settlementContainer.innerHTML += `
                    <div class="flex items-center space-x-2 text-xs sm:text-sm text-slate-200 py-1 border-b border-slate-800/60 last:border-0">
                        <i data-lucide="arrow-right-circle" class="w-4 h-4 text-emerald-400 flex-shrink-0"></i>
                        <span><strong class="text-white font-semibold">${d.name}</strong> owes <strong class="text-white font-semibold">${c.name}</strong> <span class="text-emerald-400 font-bold">$${amount.toFixed(2)}</span></span>
                    </div>`;
                count++;
            }

            d.amount = Math.round((d.amount - amount) * 100) / 100;
            c.amount = Math.round((c.amount - amount) * 100) / 100;

            if (d.amount <= 0.01) i++;
            if (c.amount <= 0.01) j++;
        }

        if (count === 0) {
            settlementContainer.innerHTML = `<div class="text-emerald-400 font-semibold flex items-center space-x-1.5"><i data-lucide="check-circle" class="w-4 h-4"></i><span>Everyone is completely settled up!</span></div>`;
        }

        lucide.createIcons();
    }
</script>
